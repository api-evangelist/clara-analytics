gaps_for_provider:
- Publish a trust center (or a /security page) that names the auditor, the report
  period, and how to request the SOC 2 report — the claim currently lives only in a
  marketing sentence.
- Publish a security.txt (RFC 9116) with a disclosure policy and contact.
- Publish the "pre-built APIs" as an OpenAPI at a stable URL; the integration surface
  is real but only visible inside the Guidewire Marketplace listing.
