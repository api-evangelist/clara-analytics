name: CLARA Analytics — conformance and compliance claims
summary: >-
  CLARA Analytics publishes no machine-readable API contract, so no spec-derived
  conformance can be asserted. What it does publish, repeated verbatim across six
  product pages, is a security and compliance claim: HIPAA compliance, an annual
  SOC 2 certification (named as "SOC 2, Type 2" on the Claims Document Intelligence
  Pro page), and data encryption. These are vendor claims on marketing pages, not a
  trust center, an audit report, or a certificate — there is no trust.claraanalytics.com,
  no /security page, and no security.txt. Recorded here with the exact source URLs
  so a reader can see the same surface we did.
