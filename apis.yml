    publishes no developer site of its own — docs.claraanalytics.com is a dangling
    CNAME to an unclaimed Document360 project that answers HTTP 200 with "Sorry! This
    project does not exist." for every path, api.claraanalytics.com answers nginx 404
    for every unauthenticated path, and the only integration surface CLARA actually
    publishes is the Built-by-Guidewire CLARAty.ai listing inside the Guidewire
    Marketplace.
