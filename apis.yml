aid: clara-analytics
name: CLARA Analytics
description: 'CLARA Analytics is an AI-as-a-service provider for casualty insurance
  claims, serving carriers, MGAs/MGUs, reinsurers, third-party administrators and self-insured
  organizations. Its CLARAty.ai platform applies document intelligence, natural language
  processing, image recognition and predictive models to medical notes, legal demand
  packages, bills and other claim documents across workers'' compensation, auto and
  general liability, with products for triage, fraud detection, litigation risk, treatment
  and provider selection, Medicare Secondary Payer compliance, and industry benchmarking.
  CLARA markets pre-built APIs for integration with RMIS and core claims systems and
  ships a Built-by-Guidewire integration for ClaimCenter through the Guidewire Marketplace,
  but publishes no public developer portal, API reference, or machine-readable specification.'
